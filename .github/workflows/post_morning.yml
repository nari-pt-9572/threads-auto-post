name: 朝投稿 (6:00 JST)

on:
  schedule:
    - cron: '0 21 * * *'  # 21:00 UTC = 6:00 JST
  workflow_dispatch:       # 手動実行も可能

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係インストール
        run: pip install -r requirements.txt

      - name: 朝の投稿実行
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          POSTING_TOPIC: ${{ secrets.POSTING_TOPIC }}
          COMPETITOR_ACCOUNTS: ${{ secrets.COMPETITOR_ACCOUNTS }}
        run: python pdca_runner.py --slot morning

      - name: データをコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "📊 朝投稿ログ更新 $(date '+%Y-%m-%d')"
          git push

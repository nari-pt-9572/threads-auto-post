name: 自動投稿（30分ごと）

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係インストール
        run: pip install -r requirements.txt

      - name: 投稿スロット判定＆実行
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          POSTING_TOPIC: ${{ secrets.POSTING_TOPIC }}
          COMPETITOR_ACCOUNTS: ${{ secrets.COMPETITOR_ACCOUNTS }}
        run: |
          python - <<'EOF'
          import json
          import subprocess
          import sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          current_hour = now.hour

          # 下書きがあれば時間帯チェックをスキップして即投稿
          draft_path = Path("data/draft_post.txt")
          if draft_path.exists():
              print(f"[{current_hour}時] 下書き検出。時間帯チェックをスキップして即投稿します。")
              result = subprocess.run(
                  ["python", "pdca_runner.py", "--slot", "morning"]
              )
              sys.exit(result.returncode)

          # 投稿スロット定義
          slot_map = {
              6:  "morning",
              20: "night1",
              21: "evening",
              22: "night2",
              23: "night3",
              0:  "midnight",
          }

          target_slot = slot_map.get(current_hour)
          if not target_slot:
              print(f"[{current_hour}時] 投稿スロットなし。スキップ。")
              sys.exit(0)

          print(f"[{current_hour}時] スロット: {target_slot}")

          # posts_log.jsonを確認
          log_path = Path("data/posts_log.json")
          posts = []
          if log_path.exists():
              with open(log_path, "r", encoding="utf-8") as f:
                  posts = json.load(f)

          # 今日のこのスロット時刻以降に投稿があるか確認
          slot_start = now.replace(hour=current_hour, minute=0, second=0, microsecond=0)
          already_posted = [
              p for p in posts
              if datetime.fromisoformat(p["timestamp"]).astimezone(JST) >= slot_start
          ]

          if already_posted:
              print(f"[{current_hour}時] 既に投稿済み({len(already_posted)}件)。スキップ。")
              sys.exit(0)

          print(f"[{current_hour}時] 未投稿。{target_slot}で投稿します。")
          result = subprocess.run(
              ["python", "pdca_runner.py", "--slot", target_slot]
          )
          sys.exit(result.returncode)
          EOF

      - name: データをコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git stash
          git pull --rebase
          git stash pop || true
          git add data/
          git diff --staged --quiet || git commit -m "📊 投稿ログ更新 $(date '+%Y-%m-%d %H:%M JST')"
          git push
